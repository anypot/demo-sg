on:
  push:
    branches:
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}

jobs:
  validate:
    name: Validate manifests structure (not k8s schemas)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Kustomize
        run: |
          kustomize build k8s/overlays/dev > /dev/null
          kustomize build k8s/overlays/prod > /dev/null

  test:
    name: Test backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Check formatting
        working-directory: backend
        run: ruff format --check .

      - name: Run tests
        working-directory: backend
        run: pytest -v

  build-and-push:
    name: Build images
    runs-on: ubuntu-latest
    needs: [validate, test]
    environment: azure
    env:
      REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to ACR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/demo-sg/frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=frontend' || '' }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/demo-sg/backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=backend' || '' }}

  deploy-dev:
    name: Deploy to AKS (dev)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: azure
    env:
      REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Set image tags
        working-directory: k8s/overlays/dev
        run: |
          kustomize edit set image \
            frontend="${REGISTRY}/demo-sg/frontend:${IMAGE_TAG}" \
            backend="${REGISTRY}/demo-sg/backend:${IMAGE_TAG}"

      - name: Apply dev overlay
        run: kubectl apply -k k8s/overlays/dev

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n demo-dev --timeout=120s
          kubectl rollout status deployment/frontend -n demo-dev --timeout=120s

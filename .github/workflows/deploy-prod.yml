name: Deploy to AKS (prod)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Release tag to deploy, e.g. v0.1.0"
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to AKS (prod)
    runs-on: ubuntu-latest
    environment: azure
    env:
      REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate branch and tag values
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Run this workflow from main, not '${GITHUB_REF}'"
            exit 1
          fi
          if ! printf '%s' "${IMAGE_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Image tag must look like vX.Y.Z, got '${IMAGE_TAG}'"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Set image tags
        working-directory: k8s/overlays/prod
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          kustomize edit set image \
            frontend="${REGISTRY}/demo-sg/frontend:${IMAGE_TAG}" \
            backend="${REGISTRY}/demo-sg/backend:${IMAGE_TAG}"

      - name: Apply prod overlay
        run: kubectl apply -k k8s/overlays/prod

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n demo-prod --timeout=120s
          kubectl rollout status deployment/frontend -n demo-prod --timeout=120s

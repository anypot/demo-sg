apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-prod

resources:
  - ../../base
  - hpa.yaml
  - ingress.yaml

images:
  - name: frontend
    newName: myregistry.azurecr.io/app-name/frontend
    newTag: vX.Y.Z
  - name: backend
    newName: myregistry.azurecr.io/app-name/backend
    newTag: vX.Y.Z
